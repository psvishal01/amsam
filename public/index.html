<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="icon" type="image/png" href="/icons/favicon.png">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Login — AMSAM Portal</title>
  <meta name="description"
    content="AMSAM Membership Portal — Login to access your membership dashboard, events and profile." />
  <!-- PWA -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#1A2040" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="AMSAM" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="stylesheet" href="/css/global.css" />
  <link rel="stylesheet" href="/css/3d-effects.css" />
  <style>
    body {
      margin: 0;
      font-family: 'Inter', 'Outfit', sans-serif;
      background: linear-gradient(135deg, #0C1F3D 0%, #1A3259 40%, #0D9488 100%);
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    .background-blobs {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }

    .blob-1 {
      position: absolute;
      top: -8rem;
      right: -8rem;
      width: 24rem;
      height: 24rem;
      border-radius: 50%;
      background: #14B8A6;
      opacity: 0.1;
    }

    .blob-2 {
      position: absolute;
      bottom: -10rem;
      left: -5rem;
      width: 20rem;
      height: 20rem;
      border-radius: 50%;
      background: #F59E0B;
      opacity: 0.1;
    }

    .blob-3 {
      position: absolute;
      top: 50%;
      left: 25%;
      transform: translateY(-50%);
      width: 16rem;
      height: 16rem;
      border-radius: 50%;
      background: #ffffff;
      opacity: 0.05;
    }

    .login-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 440px;
      padding: 0 1rem;
      box-sizing: border-box;
    }

    .header-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 5rem;
      height: 5rem;
      margin: 0 auto 1rem auto;
    }

    .header-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .page-title {
      font-family: 'Outfit', sans-serif;
      font-size: 2rem;
      font-weight: 700;
      text-align: center;
      margin: 0;
      line-height: 1.2;
    }

    .page-subtitle {
      color: rgba(255, 255, 255, 0.65);
      font-size: 0.9rem;
      text-align: center;
      margin-top: 0.25rem;
      margin-bottom: 2rem;
    }

    .login-card {
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 1rem;
      padding: 2rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    }

    .login-card h2 {
      font-size: 1.25rem;
      font-weight: 600;
      margin: 0 0 1.5rem 0;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-group label {
      display: block;
      color: rgba(255, 255, 255, 0.8);
      font-size: 0.875rem;
      margin-bottom: 0.25rem;
    }

    .input-wrapper {
      position: relative;
    }

    .form-control {
      width: 100%;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      border-radius: 0.75rem;
      padding: 0.75rem 1rem;
      box-sizing: border-box;
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s;
    }

    .form-control::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }

    .form-control:focus {
      border-color: #14B8A6;
      background: rgba(255, 255, 255, 0.15);
    }

    .form-control.has-icon {
      padding-right: 2.5rem;
    }

    .password-toggle {
      position: absolute;
      right: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.5);
      cursor: pointer;
      padding: 0;
      font-size: 1rem;
    }

    .login-btn {
      width: 100%;
      padding: 0.75rem;
      background: linear-gradient(135deg, #0D9488, #14B8A6);
      color: white;
      font-weight: 600;
      border: none;
      border-radius: 0.75rem;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: opacity 0.2s;
    }

    .login-btn:hover {
      opacity: 0.9;
    }

    .error-msg {
      background: rgba(254, 242, 242, 0.1);
      border: 1px solid rgba(254, 202, 202, 0.3);
      color: #FECACA;
      border-radius: 0.5rem;
      padding: 0.7rem 1rem;
      font-size: 0.85rem;
      margin-bottom: 1rem;
      display: none;
    }

    .error-msg.show {
      display: block;
    }

    .guest-link {
      text-align: center;
      margin-top: 1.5rem;
      color: rgba(255, 255, 255, 0.55);
      font-size: 0.875rem;
    }

    .guest-link a {
      color: #FBBF24;
      text-decoration: underline;
      text-underline-offset: 2px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="background-blobs">
    <div class="blob-1"></div>
    <div class="blob-2"></div>
    <div class="blob-3"></div>
  </div>

  <div class="login-container">
    <div class="header-logo">
      <img src="/icons/favicon.png" alt="AMSAM Logo" />
    </div>
    <h1 class="page-title">AMSAM Portal</h1>
    <p class="page-subtitle">Association of Medical Students · AIIMS Mangalagiri</p>

    <div class="login-card">
      <h2>Sign In</h2>

      <div class="error-msg" id="errorMsg">⚠️ <span id="errorText"></span></div>

      <form id="loginForm" autocomplete="off">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="you@aiims.edu" required />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <input type="password" id="password" class="form-control has-icon" placeholder="••••••••" required />
            <button type="button" class="password-toggle" id="togglePwd">👁️</button>
          </div>
        </div>
        <button type="submit" class="login-btn" id="loginBtn">Sign In</button>
      </form>

      <div class="guest-link">
        External user? <a href="/guest-signup.html">Register as Guest</a>
      </div>
    </div>
  </div>

  <script src="/js/auth.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js')
        .then(() => console.log('AMSAM PWA: Service Worker registered.'))
        .catch((err) => console.warn('SW registration failed:', err));
    }
  </script>
  <script src="/js/3d-effects.js"></script>
</body>

</html>
